name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Verification runs may cancel each other; deploys must not (see the deploy job).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build static export
        run: npm run build

      - name: Verify the exported site
        run: npm run verify

  deploy:
    name: Deploy
    needs: verify
    # Main only, and never for pull requests. A failing verify blocks the deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialise deploys and never cancel one midway through a push.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity for the deploy commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `npm run deploy` triggers the `predeploy` hook, which builds first, so
      # the published tree can never be stale.
      - name: Publish to the gh-pages branch
        run: npm run deploy
